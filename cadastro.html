<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <meta name="theme-color" content="#8ec8ff">
    <meta name="description" content="Crie sua conta de organizador na CorraAgora para publicar e gerenciar eventos esportivos.">
    <meta name="robots" content="noindex, nofollow">

    <title>Criar conta | CorraAgora</title>

    <link rel="icon" type="image/png" href="images/favicon.png">
    <link rel="stylesheet" href="assets/css/auth.css">

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script src="assets/js/supabase.js"></script>

</head>

<body>

<div class="login-container">

    <div class="login-card">

        <img src="images/logo-corraagora.png"
             class="logo">

        <h1>Criar conta</h1>

        <p>Cadastre-se para organizar seus eventos.</p>

        <form id="registerForm" novalidate>

            <input
                id="name"
                type="text"
                placeholder="Nome completo"
                required>

            <input
                id="email"
                type="email"
                placeholder="E-mail"
                required>

            <input
                id="password"
                type="password"
                placeholder="Senha"
                required>

            <button type="submit">

                Criar conta

            </button>

        </form>

        <a href="login.html">

            Já possui conta?

        </a>

    </div>

</div>

<script src="assets/js/validacao.js"></script>
<script src="assets/js/auth.js"></script>

<script defer src="/_vercel/insights/script.js"></script>
<script src="/assets/js/cookie-aviso.js" defer></script>
</body>

</html>
