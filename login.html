<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#8ec8ff">
    <meta name="description" content="Entre na sua conta de organizador CorraAgora para gerenciar seus eventos esportivos.">
    <meta name="robots" content="noindex, nofollow">
    <title>Login | CorraAgora</title>

    <link rel="icon" type="image/png" href="images/favicon.png">
    <link rel="stylesheet" href="assets/css/auth.css">

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="assets/js/supabase.js"></script>
    <script src="https://www.google.com/recaptcha/api.js" async defer></script>
</head>

<body>

<div class="login-container">

    <div class="login-card">

        <img src="images/logo-corraagora-compacta.png" class="logo" alt="CorraAgora">

        <h1>Entrar</h1>

        <p>Faça login para acessar o painel do organizador.</p>

        <form id="loginForm" novalidate>

            <input
                type="email"
                id="email"
                placeholder="E-mail"
                required
            >

            <input
                type="password"
                id="password"
                placeholder="Senha"
                required
            >

            <div
                id="loginRecaptcha"
                class="g-recaptcha"
                data-sitekey="6LcbOrEtAAAAAGXEtXz6rLutymwcp-s-deT92hUZ"
            ></div>

            <button type="submit" id="loginSubmitButton">
                Entrar
            </button>

        </form>

        <a href="#" id="forgotPasswordLink">
            Esqueci minha senha
        </a>

        <form id="forgotPasswordForm" class="hidden" novalidate>

            <p class="forgot-text">
                Informe seu e-mail para receber o link de redefinição de senha.
            </p>

            <input
                type="email"
                id="forgotEmail"
                placeholder="Seu e-mail de cadastro"
                required
            >

            <button type="submit">
                Enviar link de redefinição
            </button>

            <a href="#" id="cancelForgotPassword">
                Voltar para o login
            </a>

        </form>

        <p id="forgotMessage" class="forgot-message hidden"></p>

        <a href="cadastro.html">
            Criar uma conta
        </a>

    </div>

</div>

<script src="assets/js/validacao.js"></script>
<script src="assets/js/auth.js"></script>

<script defer src="/_vercel/insights/script.js"></script>
<script src="/assets/js/cookie-aviso.js" defer></script>
</body>
</html>
